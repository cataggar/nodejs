name: Sync main from upstream

on:
  schedule:
    - cron: "15 5 * * *"
      timezone: "America/Chicago"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sync-main-from-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync main
        run: |
          set -euo pipefail
          previous=$(git rev-parse origin/main)
          git remote add upstream https://github.com/nodejs/node.git
          git fetch --no-tags upstream refs/heads/main
          git push \
            --force-with-lease="refs/heads/main:${previous}" \
            origin FETCH_HEAD:refs/heads/main
